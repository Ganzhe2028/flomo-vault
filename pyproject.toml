[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flomo-local-vault"
version = "0.2.0"
description = "Read-only local flomo vault exporter with deterministic Notion reconciliation"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=2,<3"]

[project.scripts]
flomo-vault = "flomo_vault.cli:main"
flomo-vault-mcp = "flomo_vault.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]
